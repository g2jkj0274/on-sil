# 서버는 start 스크립트가 on-sil 폴더를 작업 폴더로 실행하므로, 아래 상대 경로는 on-sil 기준입니다.
spring.application.name=on-sil
server.address=127.0.0.1
server.port=8080
server.tomcat.basedir=data/tomcat
server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=strict

# H2 파일 DB (data/db)
spring.datasource.url=jdbc:h2:file:./data/db/onsil
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 업로드
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=-1

# 개발 중 정적 파일 캐시 끄기
spring.web.resources.cache.period=0

# on-sil
onsil.data-dir=data
onsil.livekit.ws-url=ws://127.0.0.1:7880
onsil.livekit.api-url=http://127.0.0.1:7880
onsil.livekit.api-key=devkey
onsil.livekit.api-secret=secret
